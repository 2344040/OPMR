<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OPMR - База данных участников</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .header-title {
            font-weight: 800;
            color: #0d3b66;
        }

        .header-subtitle {
            color: #6c757d;
            font-size: 0.95rem;
        }

        /* Карточки команд */
        .team-card {
            transition: transform 0.2s, box-shadow 0.2s;
            border: none;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }

        .team-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.1);
            cursor: pointer;
        }

        .org-name {
            font-weight: 700;
            color: #212529;
            font-size: 1.1rem;
            margin-bottom: 2px;
        }

        .team-meta {
            font-size: 0.85rem;
            color: #6c757d;
        }

        /* Модальное окно / Детали */
        .detail-label {
            font-weight: 600;
            color: #495057;
            font-size: 0.9rem;
        }

        .detail-value {
            color: #212529;
        }

        .member-item {
            border-left: 3px solid #0d6efd;
            padding-left: 10px;
            margin-bottom: 12px;
        }

        .member-fio {
            font-weight: 600;
        }

        .member-info {
            font-size: 0.85rem;
            color: #6c757d;
        }

        /* Кнопки управления */
        .btn-upload {
            border-radius: 20px;
            font-weight: 500;
        }
    </style>
</head>

<body>

    <div class="container py-4">
        <!-- Шапка -->
        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
            <div>
                <h2 class="header-title mb-0">Открытое первенство СПб по морской робототехнике</h2>
                <div class="header-subtitle">27–29 ноября 2026 г. | База данных участников</div>
            </div>
            <div class="d-flex gap-2">
                <label for="fileInput" class="btn btn-outline-primary btn-upload mb-0">
                    <i class="fas fa-file-upload me-2"></i>Загрузить JSON
                </label>
                <input type="file" id="fileInput" accept=".json" class="d-none">
                <button class="btn btn-primary btn-upload" onclick="alert('Функция добавления в разработке')">
                    <i class="fas fa-plus me-2"></i>Команда
                </button>
            </div>
        </div>

        <!-- Сетка команд -->
        <div class="row g-3" id="teamsContainer">
            <div class="col-12 text-center text-muted py-5">
                <div class="spinner-border text-primary" role="status"></div>
                <div class="mt-2">Загрузка данных...</div>
            </div>
        </div>
    </div>

    <!-- Модальное окно с деталями -->
    <div class="modal fade" id="teamDetailsModal" tabindex="-1">
        <div class="modal-dialog modal-lg modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header border-0 pb-0">
                    <h5 class="modal-title fw-bold" id="modalTitle"></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body pt-2" id="modalBody">
                    <!-- Сюда рендерятся детали -->
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        let teamsData = [];

        // 1. ГЛАВНАЯ ФУНКЦИЯ: Конвертация "плоского" JSON из Яндекс.Форм в нормальный объект
        function transformYandexFormsData(rawArray) {
            return rawArray.map(teamArr => {
                let obj = {};
                // Преобразуем массив пар [ключ, значение] в объект, убирая пробелы в ключах
                teamArr.forEach(([key, value]) => {
                    obj[key.trim()] = value ? value.trim() : "";
                });

                // Собираем участников (members) из полей [1] ... [8]
                let members = [];
                for (let i = 1; i <= 10; i++) {
                    let fioKey = `Ф.И.О. [${i}]`;
                    if (obj[fioKey] && obj[fioKey] !== "") {
                        members.push({
                            fio: obj[fioKey],
                            birth: obj[`Дата рождения [${i}]`] || "",
                            passport: obj[`Паспорт/Свидетельство о рождении [${i}]`] || "",
                            isStudent: obj[`Студент [${i}]`] || "",
                            order: obj[`Приказ о зачислении (для студентов) [${i}]`] || ""
                        });
                    }
                }

                return {
                    id: obj["ID"] || Math.random().toString(36).substr(2, 9),
                    created: obj["Время создания"] || "",
                    organization: obj["Организация"] || "Без названия",
                    city: obj["Город (населённый пункт)"] || "",
                    address: obj["Адрес"] || "",
                    phone: obj["Телефон/факс"] || "",
                    email: obj["Email"] || "",
                    orgLeader: obj["ФИО руководителя организации"] || "",
                    apparatusClass: obj["Класс аппарата"] || "",
                    description: obj["Краткое описание аппарата"] || "",
                    teamLeader: obj["ФИО руководителя команды"] || "",
                    teamLeaderPhone: obj["Контактный телефон руководителя команды"] || "",
                    members: members
                };
            });
        }

        // 2. Рендер списка команд (карточки)
        function renderTeams(teams) {
            const container = document.getElementById('teamsContainer');
            if (teams.length === 0) {
                container.innerHTML = '<div class="col-12 text-center text-muted py-5">Нет загруженных команд</div>';
                return;
            }

            container.innerHTML = teams.map(team => `
            <div class="col-md-6 col-lg-4">
                <div class="card team-card h-100 p-3" onclick="showTeamDetails('${team.id}')">
                    <div class="d-flex align-items-start mb-2">
                        <i class="fas fa-ship fa-2x text-primary me-3 mt-1"></i>
                        <div>
                            <div class="org-name">${team.organization}</div>
                            <div class="team-meta"><i class="fas fa-microchip me-1"></i> ${team.apparatusClass || 'Класс не указан'}</div>
                        </div>
                    </div>
                    <div class="mt-auto pt-2 border-top">
                        <div class="d-flex justify-content-between align-items-center">
                            <span class="team-meta"><i class="fas fa-users me-1"></i> ${team.members.length} участн.</span>
                            <span class="team-meta"><i class="fas fa-user-tie me-1"></i> ${team.teamLeader.split(' ')[0] || '—'}</span>
                        </div>
                    </div>
                </div>
            </div>
        `).join('');
        }

        // 3. Открытие деталей команды
        function showTeamDetails(teamId) {
            const team = teamsData.find(t => t.id === teamId);
            if (!team) return;

            document.getElementById('modalTitle').textContent = team.organization;

            let membersHtml = team.members.length > 0 ? team.members.map((m, idx) => `
            <div class="member-item">
                <div class="member-fio">${idx + 1}. ${m.fio}</div>
                <div class="member-info">
                    ${m.birth ? `<i class="fas fa-birthday-cake me-1"></i> ${m.birth}` : ''} 
                    ${m.isStudent === 'Да' ? `<span class="badge bg-info text-dark ms-2">Студент</span>` : ''}
                </div>
                ${m.order ? `<div class="member-info"><i class="fas fa-file-alt me-1"></i> ${m.order}</div>` : ''}
            </div>
        `).join('') : '<div class="text-muted">Состав команды не указан</div>';

            document.getElementById('modalBody').innerHTML = `
            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <div class="detail-label">Руководитель организации</div>
                    <div class="detail-value">${team.orgLeader || '—'}</div>
                </div>
                <div class="col-md-6">
                    <div class="detail-label">Руководитель команды</div>
                    <div class="detail-value">${team.teamLeader || '—'} <br><small class="text-muted">${team.teamLeaderPhone}</small></div>
                </div>
                <div class="col-12">
                    <div class="detail-label">Описание аппарата</div>
                    <div class="detail-value" style="font-size: 0.9rem;">${team.description || '—'}</div>
                </div>
            </div>
            <hr>
            <h6 class="fw-bold mb-3"><i class="fas fa-users me-2"></i>Состав команды (${team.members.length})</h6>
            ${membersHtml}
        `;

            new bootstrap.Modal(document.getElementById('teamDetailsModal')).show();
        }

        // 4. Обработка загрузки файла пользователем
        document.getElementById('fileInput').addEventListener('change', function (event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function (e) {
                try {
                    const rawData = JSON.parse(e.target.result);
                    teamsData = transformYandexFormsData(rawData);
                    renderTeams(teamsData);
                } catch (err) {
                    alert('Ошибка чтения JSON файла. Убедитесь, что файл имеет корректный формат.');
                    console.error(err);
                }
            };
            reader.readAsText(file);
        });

        // 5. Автоматическая загрузка из data/teams.json при старте
        async function loadDefaultData() {
            try {
                const response = await fetch('data/teams.json');
                if (!response.ok) throw new Error('Файл не найден');
                const rawData = await response.json();
                teamsData = transformYandexFormsData(rawData);
                renderTeams(teamsData);
            } catch (error) {
                document.getElementById('teamsContainer').innerHTML = `
                <div class="col-12 text-center text-muted py-5">
                    <i class="fas fa-exclamation-triangle fa-2x mb-2 text-warning"></i>
                    <div>Не удалось загрузить <code>data/teams.json</code>.<br>Загрузите файл вручную через кнопку выше.</div>
                </div>`;
            }
        }

        // Запуск
        loadDefaultData();
    </script>

</body>

</html>
