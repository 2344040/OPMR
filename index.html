            --card: #fff;
            --ink: #16212e;
            --muted: #64748b;
            --brand: #0b5fff;
            --line: #e2e8f0;
            --title: #517CB3

        * {

        }

        body {

            text-align: center

        .tabs {

            gap: 6px;
            background: #f1f5f9;
            border-radius: 12px;
            padding: 4px
        }

        .tab {

            background: transparent;
            color: var(--muted);
            padding: 8px 14px;
            border-radius: 9px;
            font: inherit;
            font-weight: 600;
            cursor: pointer
        }

        .tab.active {
            background: #fff;
            color: var(--brand);
            box-shadow: 0 1px 2px #0f172a14
        }

        button,
        .btn {
            border: 0;
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 14px;
            cursor: pointer;
            background: var(--brand);
            color: #fff;
            font-weight: 600
        }

        button.ghost {
            background: #eef2ff;
            color: var(--brand)
        }

        button.danger {
            background: #fee2e2;
            color: #b91c1c
        }

        button.small {
            padding: 7px 10px;
            font-size: 13px
        }

        main {
            max-width: 1100px;
            margin: 0 auto;
            padding: 16px
        }

        .toolbar {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 14px
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--line);
            border-radius: 10px;
            font: inherit;
            background: #fff
        }

        .search {
            flex: 1;
            min-width: 220px
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));

        }

        .card {

            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 14px;
            box-shadow: 0 1px 2px #0f172a0a;
            cursor: pointer;
            position: relative
        }

        .card h3 {
            margin: 0 40px 6px 0;
            font-size: 16px
        }

        .meta {
            color: var(--muted);
            font-size: 13px;
            margin: 2px 0
        }

        .badge {
            display: inline-block;
            background: #eef2ff;
            color: var(--brand);
            border-radius: 999px;
            padding: 3px 9px;
            font-size: 12px;
            font-weight: 600
        }

        .type-chip {
            font-weight: 800;
            font-size: 16px;
            padding: 8px 12px;
            border-radius: 12px;
            color: #fff;
            white-space: nowrap
        }

        .type-chip.large {
            font-size: 18px;
            padding: 10px 14px
        }

        .type-anpa {
            background: #0b5fff
        }

        .type-tnpa {
            background: #0f9d58
        }

        .type-bek {
            background: #ea7317
        }

        .type-unknown {
            background: #64748b
        }

        .card .type-chip {
            position: absolute;
            right: 14px;
            bottom: 14px
        }

        .row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center
        }

        .section {
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 16px;
            padding: 18px;
            margin-bottom: 14px
        }

        .section h2 {
            margin: 0 0 12px;
            font-size: 17px
        }

        .section-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px
        }

        .section-head h2 {
            margin: 0
        }

        .page-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px
        }

        .page-head .title {
            flex: 1;
            min-width: 0
        }

        .field {
            margin-bottom: 10px
        }

        label {
            display: block;
            font-size: 13px;
            color: var(--muted);
            margin-bottom: 4px
        }

        .members {
            display: grid;
            gap: 10px
        }

        .member {
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 12px;
            background: #fafafa
        }

        .member-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px
        }

        @media(max-width:640px) {
            .member-grid {
                grid-template-columns: 1fr
            }
        }

        .hidden {
            display: none !important
        }

        .empty {
            text-align: center;
            color: var(--muted);
            padding: 30px 10px
        }

        .photo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 12px;
            margin-top: 12px
        }

        .photo {
            border: 1px solid var(--line);
            border-radius: 12px;
            overflow: hidden;
            background: #fff
        }

        .photo-frame {
            height: 220px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f8fafc;
            padding: 8px;
            cursor: zoom-in
        }

        .photo img {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain
        }

        .photo-fallback {
            padding: 18px;
            text-align: center;
            color: var(--muted);
            font-size: 13px
        }

        .photo-actions {
            display: flex;
            gap: 6px;
            padding: 8px;
            flex-wrap: wrap
        }

        .photo-actions a,
        .photo-actions button {
            flex: 1;
            text-align: center;
            text-decoration: none;
            font-size: 12px;
            padding: 7px 8px;
            border-radius: 8px;
            border: 0;
            cursor: pointer
        }

        .photo-actions a,
        .photo-actions button {
            background: #eef2ff;
            color: var(--brand);
            font-weight: 600

            font-size: 12px;

            font-size: 13px

            overflow-x: auto
        }

        .toast {

            left: 50%;
            bottom: 18px;
            transform: translateX(-50%);
            background: #111827;
            color: #fff;
            padding: 10px 16px;
            border-radius: 999px;
            font-size: 14px;
            opacity: 0;
            pointer-events: none;
            transition: .2s;
            z-index: 20
        }

        .toast.show {
            opacity: 1
        }

        .lightbox {
            position: fixed;
            inset: 0;
            background: #0b1220f2;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
            z-index: 50

        .lightbox img {
            max-width: 100%;
            max-height: calc(100vh - 130px);
            object-fit: contain;
            border-radius: 12px;
            background: #fff
        }

        .lightbox .bar {
            position: absolute;
            top: 16px;
            right: 16px
        }

        .lightbox .bar button {
            background: #ffffff22;
            color: #fff;
            border: 1px solid #ffffff44
        }

        .lightbox .nav {
            position: absolute;
            bottom: 18px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            align-items: center
        }

        .lightbox .nav button {
            background: #ffffff22;
            color: #fff;
            border: 1px solid #ffffff44
        }

        .lightbox .counter {
            color: #fff;
            font-size: 14px;
            min-width: 64px;
            text-align: center
        }

            .members-table {
                display: none
            }

                gap: 2px
            }

            .member-card .item b {

            }

            .card .type-chip {

                right: 14px;
                bottom: 14px
            }

            .card h3 {
                margin-right: 0
            }

            .page-head {
                flex-direction: row;
                align-items: center
            }

            h1 {
                font-size: 20px
            }
        }

        @media print {

            header,
            .toolbar,
            .no-print,
            .lightbox {
                display: none !important
            }

            body {
                background: #fff
            }

            main {
                max-width: none;
                padding: 0
            }

            .card,
            .section {
                border: 0;
                box-shadow: none;
                padding: 0;
                margin: 0 0 14px
            }

            .page-title h2 {
                font-size: 22px
            }

            .photo-frame {
                height: auto;
                max-height: 320px
            }

            .photo img {
                max-height: 320px
            }

            .photo-actions {
                display: none
            }

            .member-cards {
                display: none !important
            }

            .members-table {
                display: table !important
            }

            .kv a {
                color: inherit;
                text-decoration: none
            }
        }
    </style>
</head>

                <button id="editBtn" onclick="toggleEdit()">Редактировать</button>
                <button class="ghost" onclick="window.print()">Печать / PDF</button>
                <button class="ghost" onclick="downloadPhotos()">Скачать все фото</button>
                <button id="deleteBtn" class="danger hidden" onclick="deleteTeam()">Удалить</button>

            <div id="teamContent"></div>
        </div>
    </main>
    <div id="toast" class="toast"></div>
    <div id="lightbox" class="lightbox" onclick="if(event.target===this)closeLightbox()">

                members.push({ fullName: name, birthDate: String(get(`Дата рождения [${i}]`) || ''), document: String(get(`Паспорт/Свидетельство о рождении [${i}]`) || ''), isStudent: String(get(`Студент [${i}]`) || '').toLowerCase() === 'да', enrollmentOrder: String(get(`Приказ о зачислении (для студентов) [${i}]`) || '') });
            }
            return { id: String(get('ID') || ''), createdAt: String(get('Время создания') || ''), organization: String(get('Организация') || '').trim(), city: String(get('Город (населённый пункт)') || '').trim(), region: String(get('Республика/край/область') || '').trim(), postalCode: String(get('Почтовый индекс') || '').trim(), address: String(get('Адрес') || '').trim(), organizationPhone: String(get('Телефон/факс') || '').trim(), email: String(get('Email') || '').trim(), organizationHead: String(get('ФИО руководителя организации') || '').trim(), vehicleClass: String(get('Класс аппарата') || '').trim(), vehicleDescription: String(get('Краткое описание аппарата') || '').trim(), vehiclePhotos: photos, teamLead: String(get('ФИО руководителя команды') || '').trim(), teamLeadPhone: String(get('Контактный телефон руководителя команды') || '').trim(), consent: String(get('Даю согласие на обработку персональных данных') || '').toLowerCase() === 'да', members };
        }
        function normalizeStoredTeam(t) { return { ...t, vehiclePhotos: t.vehiclePhotos || [], members: t.members || [], consent: !!t.consent } }

        showTeams();
    </script>
